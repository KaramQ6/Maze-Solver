name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov

      - name: Run Ruff Linter
        run: ruff check maze_solver tests mms_main.py convert_mazes.py tools/register_mazes_in_mms.py

      - name: Check Ruff Formatting
        run: ruff format --check maze_solver tests mms_main.py convert_mazes.py tools/register_mazes_in_mms.py

      - name: Run Mypy Typecheck
        run: mypy maze_solver tests

      - name: Run Pytest Test Suite
        run: pytest -v --cov=maze_solver

      - name: Run C99 firmware tests
        run: make -C firmware test

      - name: Run C3 motor and sensor regression tests
        run: make -C firmware test-c3

      - name: Check C++ firmware host compilation
        run: g++ -std=c++11 -Wall -Wextra -Werror -fsyntax-only -I firmware/include firmware/src/main.cpp firmware/src/controller.cpp firmware/src/sensors.cpp firmware/src/motors.cpp firmware/src/encoder.cpp firmware/test/test_firmware_sim.cpp

      - name: Build ESP32-C3 firmware
        run: |
          python -m pip install 'platformio>=6,<7'
          pio run -e esp32_c3_supermini
